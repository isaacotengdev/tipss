name: Build & Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Next.js & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1 ── Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2 ── Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3 ── Install dependencies
      - name: Install dependencies
        working-directory: web
        run: npm install

      # 4 ── Build Next.js (static export)
      - name: Build Next.js
        working-directory: web
        run: npm run build

      # 5 ── Upload build artefact
      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: tipss-web-build
          path: web/out
          retention-days: 7

      # 6 ── Deploy to DigitalOcean droplet via SCP
      - name: Deploy to droplet (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          source: "web/out/*"
          target: "/var/www/tipss_web"
          strip_components: 2

      # 7 ── Reload Nginx
      - name: Reload Nginx on droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          script: |
            sudo nginx -t && sudo systemctl reload nginx
            echo "✅ Deployment complete — $(date)"
