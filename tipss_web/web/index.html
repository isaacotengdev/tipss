  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tipss.io/">
  <meta property="og:title" content="Tipss — Smart Tipping Apps for Individuals &amp; Businesses">
  <meta property="og:description" content="Two apps. One platform. TipMe for individuals. TipBiz for businesses. Tipping, reimagined.">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@tipssapp">
  <meta name="twitter:title" content="Tipss — Smart Tipping Apps">
  <meta name="twitter:description" content="TipMe for individuals. TipBiz for businesses. Tipping, reimagined.">

  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Web Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Flutter Bootstrap -->
  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <script src="flutter.js" defer></script>

  <style>
    body {
      background-color: #ffffff;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #ffffff;
    }
    .loading-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #00D68F;
      margin: 0 5px;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
  </div>

  <noscript>
    <h1>Tipss — Smart Tipping Apps</h1>
    <p>TipMe helps individuals receive tips instantly via QR code. TipBiz helps businesses manage fair tip pooling for their teams. Available on iOS and Android.</p>
  </noscript>

  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            document.getElementById('loading').style.display = 'none';
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
