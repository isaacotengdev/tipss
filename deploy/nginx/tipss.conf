server {
    listen 80;
    listen [::]:80;
    server_name tipss.io www.tipss.io;

    # Redirect HTTP → HTTPS (enable once SSL is configured)
    # return 301 https://$host$request_uri;

    root /var/www/tipss_web;
    index index.html;

    # Flutter Web — all routes fall back to index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted assets (Flutter generates hashed filenames)
    location ~* \.(js|css|wasm|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
    }

    # Images and fonts
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|otf)$ {
        expires 6M;
        add_header Cache-Control "public";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        application/wasm;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN"            always;
    add_header X-Content-Type-Options "nosniff"        always;
    add_header Referrer-Policy "strict-origin"         always;
    add_header X-XSS-Protection "1; mode=block"       always;

    # Hide Nginx version
    server_tokens off;
}

